<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Angel Smart Diary</title>

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Floating Background -->

    <div class="background-hearts">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>

    <!-- Main Container -->

    <div class="scene">

        <!-- Diary -->

        <div class="diary" id="diary">

            <!-- Gold Corners -->

            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>

            <!-- Gold Border -->

            <div class="gold-border"></div>

            <!-- Glow -->

            <div class="cover-light"></div>

            <!-- Content -->

            <div class="cover-content">

                <h2 class="small-title">

                    My Personal

                </h2>

                <h1 class="angel">

                    ANGEL

                </h1>

                <p class="smart">

                    Smart Diary

                </p>

                <div class="line"></div>

                <p class="verse">

                    “He will wipe every tear from their eyes...”

                </p>

                <h3 class="reference">

                    Revelation 21:4

                </h3>

                <button id="enterBtn">

                    <i class="fa-solid fa-book-open"></i>

                    Enter Diary

                </button>

            </div>

        </div>

    </div>

    <!-- Opening Animation -->

    <div class="transition" id="transition">

        <div class="page one"></div>
        <div class="page two"></div>
        <div class="page three"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
