<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Angel Diary</title>

    <!-- Fonts -->

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Icons -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="diary.css">

</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->

        <div class="sidebar">

            <h1 class="logo">ANGEL</h1>

            <p class="tag">Smart Diary</p>

            <div class="menu">

                <button class="active"><i class="fa fa-home"></i> Home</button>

                <button><i class="fa fa-pen"></i> New Entry</button>

                <button><i class="fa fa-calendar"></i> Calendar</button>

                <button><i class="fa fa-heart"></i> Favorites</button>

                <button><i class="fa fa-face-smile"></i> Mood</button>

                <button><i class="fa fa-gear"></i> Settings</button>

            </div>

        </div>

        <!-- MAIN -->

        <div class="main">

            <!-- HEADER -->

            <div class="header">

                <h2>Good Evening, Angel ❤️</h2>

                <p id="date"></p>

            </div>

            <!-- CARDS -->

            <div class="cards">

                <div class="card">

                    <i class="fa fa-book"></i>

                    <h3>New Entry</h3>

                    <p>Write your thoughts</p>

                </div>

                <div class="card">

                    <i class="fa fa-heart"></i>

                    <h3>Mood Tracker</h3>

                    <p>How are you feeling?</p>

                </div>

                <div class="card">

                    <i class="fa fa-calendar"></i>

                    <h3>Calendar</h3>

                    <p>View memories</p>

                </div>

                <div class="card">

                    <i class="fa fa-star"></i>

                    <h3>Favorites</h3>

                    <p>Special moments</p>

                </div>

            </div>

            <!-- QUICK ENTRY -->

            <div class="entry-box">

                <h3>Write Something Today ✨</h3>

                <textarea placeholder="Start writing your thoughts..."></textarea>

                <button>Save Entry</button>

            </div>

        </div>

    </div>

    <script src="diary.js"></script>

</body>

</html>
